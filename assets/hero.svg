<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#071426" />
      <stop offset="1" stop-color="#0b3a2f" />
    </linearGradient>
    <filter id="f" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#g)" />
  <!-- grid lines -->
  <g opacity="0.06" stroke="#4fbf9f" stroke-width="1">
    <path d="M0 360 L1200 360" />
    <path d="M0 300 L1200 300" />
    <path d="M0 240 L1200 240" />
    <path d="M0 180 L1200 180" />
    <path d="M0 120 L1200 120" />
  </g>

  <!-- stylized terminal window -->
  <g transform="translate(60,60)">
    <rect width="1080" height="300" rx="14" fill="#0b1114" opacity="0.9"/>
    <rect x="12" y="12" width="1056" height="36" rx="8" fill="#0e1619" />
    <g transform="translate(32,22)" fill="#ff6b6b">
      <circle cx="0" cy="0" r="6" />
    </g>
    <g transform="translate(62,22)" fill="#ffd166">
      <circle cx="0" cy="0" r="6" />
    </g>
    <g transform="translate(92,22)" fill="#06d6a0">
      <circle cx="0" cy="0" r="6" />
    </g>

    <!-- code lines -->
    <g fill="#9be7c4" font-family="monospace" font-size="18" transform="translate(36,80)">
      <text x="0" y="0">$ git clone https://github.com/abdul07543/Killer_404.git</text>
      <text x="0" y="28">$ cd Killer_404</text>
      <text x="0" y="56">$ docker-compose up --build</text>
    </g>

    <!-- decorative circles -->
    <g transform="translate(860,40)" fill="#22c1c3" opacity="0.12">
      <circle cx="0" cy="0" r="60" />
    </g>

    <!-- small glowing nodes -->
    <g fill="#59f0c9" opacity="0.6">
      <circle cx="320" cy="200" r="3" />
      <circle cx="450" cy="160" r="3" />
      <circle cx="600" cy="210" r="3" />
      <circle cx="760" cy="150" r="3" />
    </g>
  </g>

  <!-- title -->
  <g transform="translate(80,36)">
    <text x="0" y="0" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, 'Helvetica Neue', Arial" font-size="36" fill="#ffffff">Killer_404</text>
    <text x="0" y="38" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto" font-size="16" fill="#cdeedf">A polished personal repo template with advanced starter features and demos</text>
  </g>

  <!-- subtle vignette -->
  <rect x="0" y="0" width="1200" height="420" fill="black" opacity="0.02" filter="url(#f)" />
</svg>
